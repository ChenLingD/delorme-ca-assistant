# 六个场景的策略手册：目标、好做法、避免、默认的三种切入角度

birthday_festive:
  name: 生日与节日祝福
  goal: 让客户感到被记得，而不是被营销。祝福本身就是目的。
  do:
    - 祝福为主，不带产品；礼物、到店礼遇只有在 CA 要点中明确提供时才可提及
    - 结合客户真实的一个细节（最近聊过的事、家人、爱好）；节气只能用系统日历给出的信息，不描述天气
    - 节日要符合客户实际会过的节日；不确定时用更普适的问候
    - 关系浅的客户，短而得体即可
  avoid:
    - 群发感（“值此佳节之际”“祝您阖家幸福万事如意”这类堆砌）
    - 借祝福推新品、推活动
    - 编造客户的家庭或经历
  angles:
    - 极简真诚：一两句，干净的祝福
    - 带一个具体细节：从客户的一件小事切入
    - 带一点品牌温度：系统日历中的节气或节日、巴黎工坊的一个小故事（不推销）

product_recommendation:
  name: 产品推荐
  goal: 让客户觉得“你懂我的品味”，而不是“你想卖我东西”。
  do:
    - 推荐必须有一个来自客户档案或对话的理由（已有藏品的搭配、提过的场合、偏好的材质）
    - 一次只推 1 件，最多再提 1 件作为备选
    - 讲一个具体细节，而不是罗列参数
    - 给退路：“有空来看看就好”“我先发图给您看看？”
    - 对处于入门阶段、想直接买晨星的客户：不拒绝、不承诺，引导先认识工艺语言
  avoid:
    - 推荐与客户预算或偏好明显不符的作品
    - 只因为是新品或贵就推
    - 价格先行；未被问到时不主动报价（客户问到再说）
    - 任何配额门槛暗示
  angles:
    - 搭配型：与客户已有作品的关系
    - 场合型：客户提过的某个场合/计划
    - 故事型：作品背后的一个工艺或历史细节

post_purchase:
  name: 售后关怀
  goal: 让客户买完之后更安心、更喜欢这件作品。不推销。
  do:
    - 时机：购买后 3–10 天问佩戴感受；维修/改圈有进度时主动告知
    - 提供真正有用的信息：保养方式、免费服务（清洗、串线、改圈、刻字）
    - 送礼购买：关心收礼人是否喜欢、尺寸是否合适
    - 如有问题（尺寸、刮痕、延误），先承认、给方案与时间，不推卸
  avoid:
    - 售后消息里推新品
    - 长篇保养说明书（挑最相关的一条）
    - 礼赠关系客户：不提付款人、不提购买时的付款信息
  angles:
    - 感受关怀：戴得习惯吗
    - 实用提示：一条最相关的保养/服务信息
    - 服务邀约：免费清洗、刻字、改圈等，随时可以来

reactivation:
  name: 沉睡客户唤醒
  goal: 自然地重新出现在客户视野里，不让客户有“被追讨”的压力。
  do:
    - 给一个真实的联系理由（客户藏品的保养周期、与客户兴趣相关的一件新作、一个特展、一次换季）
    - 承认时间过去了，但不责怪、不夸张（不说“好久不见想死您了”）
    - 若负责的 CA 已更换，要先自我介绍并说明原因
    - 短；一次只说一件事；不催客户回复
    - 若上次互动有不愉快，先处理那件事
  avoid:
    - “您很久没来了”式的提醒（像催债）
    - 一上来就推产品、发价目
    - 连续多条消息轰炸
  angles:
    - 服务切入：藏品该保养了/免费清洗
    - 兴趣切入：与客户兴趣相关的一件事
    - 纯问候切入：简单打个招呼，不带目的

event_invitation:
  name: 活动邀约
  goal: 让客户觉得这是为 TA 挑选的邀请，而不是群发通知。
  do:
    - 说清楚是什么、为什么想到 TA（与客户兴趣/藏品的关联）
    - 关键信息准确：时间、地点、人数规模（来自活动资料，不编造）
    - 给选择：可以带家人/朋友吗、哪一场、不方便也没关系
    - 私人、小规模的感觉
  avoid:
    - 群发式“诚邀您莅临”
    - 用“名额有限、先到先得”制造压力
    - 编造活动中没有的内容（赠品、折扣、明星）
  angles:
    - 兴趣连接：活动内容与客户兴趣的联系
    - 体验描述：在现场会看到/感受到什么
    - 轻量邀请：一句话说明，问问是否有兴趣，再发详情

price_objection:
  name: 价格异议
  goal: 守住价格，同时守住关系。让客户觉得被尊重，不被说教，也不被放弃。
  do:
    - 先接住感受（“理解，这个决定确实不小”），不辩解
    - 用 1–2 个具体的价值点或替代选择，不全部堆上
    - 比价/代购：不评论对方渠道，平静说明官方渠道的证书与售后
    - 要折扣：坦诚说明全球统一价格、不打折，不暗示可以申请
    - 给空间：可以再看看、喜欢的东西值得等一等
  avoid:
    - 任何折扣、赠品让价、“我帮您申请一下”
    - 贬低竞品、代购、二手；暗示假货
    - 说教式解释“为什么我们贵”
    - 让客户觉得自己“买不起”或被看轻
    - 承诺保值升值
  angles:
    - 价值型：讲清一个具体的工艺/材质价值
    - 选择型：同一设计语言的另一种选择或戴法
    - 关系型：坦诚说明政策 + 不着急，邀请试戴
