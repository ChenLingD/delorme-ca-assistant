events:
  - id: EVT-2611-SH
    name: 沧海·百年 珍珠特展 私享预览
    date: 2026-11-20 至 2026-11-22（正式开展 11-23）
    place: 上海外滩源旗舰店三楼沙龙
    content: 首次公开 Henri Delorme 1920 年代上海珍珠手绘图稿原件；巴黎工坊珍珠串线师现场演示；可试戴“沧海·百年”编号款。每场 8 位客人，含下午茶。
  - id: EVT-2612-BJ
    name: 旺多姆之夜 高级珠宝私人鉴赏
    date: 2026-12-12 至 2026-12-13
    place: 北京 SKP 精品店私享厅
    content: 高级珠宝独一件私人鉴赏，每场 2–4 位客人，提前一周确认。
  - id: EVT-2612-CD
    name: 工坊开放日：镶嵌师的一天
    date: 2026-12-05
    place: 成都太古里精品店
    content: 巴黎工坊镶嵌师现场演示“看不见的镶爪”，客人可在放大镜下观看；可携带家人。
  - id: EVT-2701-ALL
    name: 新春私宴
    date: 2027-01-23（各店分别举行）
    place: 各精品店
    content: 春节前小型私宴，可现场预约刻字新春礼物。

gifting_policy: >
  生日当月到店的客人，门店会准备一份小礼物（手写卡片 + 巴黎工坊香氛蜡烛），与是否购买无关。
  品牌不以赠品作为价格让步。
