# Maison Delorme 德洛姆 — 产品、活动、门店（全部虚构）
# 价格为中国大陆零售价（人民币，含税）

collections:
  ondine:
    name: 涟漪 Ondine
    tier: 入门
    story: 灵感来自塞纳河面被风吹起的细纹。18K 金细链与小面积镶钻，日常可戴。
  mer_de_chine:
    name: 沧海 Mer de Chine
    tier: 入门-核心
    story: 源自 1920 年代 Henri Delorme 在上海采购南洋珍珠的手绘图稿。2026 年为这段渊源一百周年。
  coupole:
    name: 穹顶 Coupole
    tier: 核心
    story: 以巴黎穹顶的弧线与旺多姆广场的柱式为灵感，几何感强，18K 金与钻石。
  serment:
    name: 誓约 Serment
    tier: 核心
    story: 婚嫁系列。标志是“看不见的镶爪”，主石仿佛悬浮。可在内圈刻字。
  atelier:
    name: 工坊 Atelier
    tier: 入门-核心
    story: 男士系列，袖扣、领针与戒指，取材于工坊工具的形状。
  etoile:
    name: 晨星 Étoile
    tier: 晨星资格（配额）
    story: 品牌标志作品。每一只由同一位工匠完成，约 120 工时，内圈刻有工匠记号。巴黎工坊按年度排期，数量极少。
  nuits_vendome:
    name: 旺多姆之夜 Nuits Vendôme
    tier: 高级珠宝（私人预约）
    story: 高级珠宝独一件，仅在私人预约时展示。

