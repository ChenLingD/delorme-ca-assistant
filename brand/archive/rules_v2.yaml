# 可自动检查的品牌规则（rule checker 使用）

# 出现即违规（hard fail）
banned_terms:
  address:  [亲爱的, 宝子, 家人们, 美女, 帅哥, 小姐姐, 小哥哥, 老板娘, 姐妹们, "亲，", "亲~", "亲！"]
  pushy:    [限时, 最后一件, 仅剩, 手慢无, 抢购, 秒杀, 马上涨价, 错过就没, 赶紧, 速来, 闭眼入, 爆款, 网红款, 必入, 冲鸭]
  price:    [折扣, 打折, 优惠, 划算, 性价比, 便宜, 特价, 活动价, 让利, 返现, 满减, 内部价]
  invest:   [保值, 升值, 投资, 回本, 理财, 增值]
  allocation: [配货, 配额门槛, 消费满, 买够, 先买, 消费记录够, 门槛]
  slang:    [yyds, 绝绝子, 无语子, "666", 种草, 拔草, 剁手]

# 营销类 emoji，出现即违规
banned_emoji: ["🔥", "💰", "🎉", "👉", "❗", "‼", "💥", "🛒", "💸", "🤑", "📣", "⚡"]
# 允许的温和 emoji（最多 1 个，且仅限节日/生日场景）
soft_emoji: ["🌙", "🌸", "🎂", "✨", "🍂", "❄️", "🌿", "🎄", "🧧"]
max_emoji: 1
emoji_allowed_scenarios: [birthday_festive]

max_exclamation: 1
forbidden_punct: ["~~", "！！", "!!", "？？", "【", "】", "★", "↓↓"]

# 陈词滥调（软约束：不直接判失败，计入重复度/模板感扣分）
cliches: [都记着, 同事都, 全店, 安心过好, 一切都好, 见字如面, 冒昧打扰, 希望您一切安好, 一直惦记着您, 祝您生活愉快, 期待您的光临, 有任何问题随时联系我, 随时为您服务, 竭诚为您, 尊贵的, 尊敬的客户, 感谢您一直以来的支持, 静候您的光临]

# 长度（中文字符数，不含空白）
length:
  default: {min: 8, max: 120}
  event_invitation: {min: 15, max: 160}
  post_purchase: {min: 8, max: 150}
  price_objection: {min: 10, max: 140}
